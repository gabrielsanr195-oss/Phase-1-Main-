version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: phase1plus_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: phase1plus
      POSTGRES_USER: phase1plus
      POSTGRES_PASSWORD: phase1plus_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phase1plus']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phase1plus_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
